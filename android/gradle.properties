# Memory: 4G heap + 2G metaspace asked Windows for ~6 GB and crashed the JVM
# ("Native memory allocation (mmap) failed"). 2 GB heap is ample for a Flutter
# Android build and leaves room for the IDE and browser to stay open.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
android.enableJetifier=true

# Keep memory use predictable on a machine with limited RAM.
org.gradle.parallel=false
org.gradle.caching=true

# Retry transient network failures (DNS blips, dropped connections) instead
# of failing the whole build on the first hiccup — helpful on unstable wifi.
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500
