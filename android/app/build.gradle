plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.yves.finwise"
    // Pinned explicitly rather than inheriting flutter.compileSdkVersion,
    // which varies with the installed Flutter SDK. Google Play requires apps
    // to target Android 16 (API 36); an earlier build silently dropped to 35
    // after a Flutter upgrade and was flagged.
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        // Required by flutter_local_notifications (uses newer Java time APIs
        // on older Android versions via desugaring).
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.yves.finwise"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // Raised from Flutter's default (21) to 23 — required by the `telephony`
        // package (SMS auto-detection) which uses APIs not available before
        // Android 6.0. This means FinWise now requires Android 6.0+ to install.
        minSdk = 23
        // Android 16 — required by Google Play. Pinned for the same reason
        // as compileSdk above.
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file("${rootProject.projectDir}/${keystoreProperties['storeFile']}") : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Backports the Java 8+ time APIs flutter_local_notifications relies on
    // to the older Android versions FinWise supports (min SDK 23).
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}
